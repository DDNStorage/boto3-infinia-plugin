[project]
name = "boto3-infinia-plugin"
version = "2.5.0"
description = "Boto3 extensions for DDN Infinia (RDMA acceleration, unlimited tagging)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DataDirect Networks, Inc." }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.20.0",
    "botocore>=1.23.0",
    "cppyy>=2.0.0",
]

[project.optional-dependencies]
examples = [
    "numpy>=2.5.1",
]
gpu = [
    "cupy-cuda13x>=14.1.1",
]
all-examples = [
    "numpy>=2.5.1",
    "cupy-cuda13x>=14.1.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "boto3_infinia"
